<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0a14">
<title>Happy Birthday</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<link rel="preload" href="fonts/NanumGaRamYeonGgoc.woff2" as="font" type="font/woff2" crossorigin>
<style>
  :root{ --ink:#2b1d2e; --paper:#fffaf2; --pink:#f5d38a; --accent:#e8485f; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;background:#0d0a14;overflow:hidden;overscroll-behavior:none;}
  body{
    position:fixed;inset:0;font-family:'Galmuri11','Galmuri9',monospace;color:var(--ink);
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;
  }
  #app{height:100%;max-width:520px;margin:0 auto;position:relative;}
  #screen{position:absolute;inset:0;overflow:hidden;}
  #game{display:block;width:100%;height:100%;image-rendering:crisp-edges;image-rendering:pixelated;}

  #title{
    position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 16px);
    text-align:center;font-size:16px;color:#fff;letter-spacing:1px;pointer-events:none;
    text-shadow:2px 0 0 var(--ink),-2px 0 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);
    transition:opacity .4s;
  }
  #shout{                                        /* 외치는 말풍선 (귀여운 폰트) */
    position:absolute;left:50%;width:max-content;max-width:86%;text-align:center;pointer-events:none;
    font-family:'Jua','Galmuri11',sans-serif;font-size:25px;line-height:1.3;color:#2b1d2e;
    background:#fffaf2;border:4px solid #2b1d2e;border-radius:22px;padding:12px 20px 10px;
    box-shadow:0 5px 0 rgba(43,29,46,.45);
    transform:translateX(-50%);transform-origin:50% 100%;
    animation:shoutIn .45s cubic-bezier(.3,1.6,.5,1) both, shoutShake .1s linear .45s 4, shoutOut .5s ease 3.4s forwards;
  }
  #shout b{color:#e8485f;font-weight:normal;}
  #shout::after{                                 /* 말꼬리 */
    content:"";position:absolute;left:50%;bottom:-17px;margin-left:-11px;width:22px;height:16px;
    background:#2b1d2e;clip-path:polygon(0 0,100% 0,50% 100%);
  }
  #shout::before{
    content:"";position:absolute;left:50%;bottom:-9px;margin-left:-7px;width:14px;height:10px;z-index:1;
    background:#fffaf2;clip-path:polygon(0 0,100% 0,50% 100%);
  }
  @keyframes shoutIn{0%{transform:translateX(-50%) scale(.2);opacity:0;}100%{transform:translateX(-50%) scale(1);opacity:1;}}
  @keyframes shoutShake{0%,100%{transform:translateX(-50%) rotate(0);}50%{transform:translateX(-50%) rotate(1.2deg);}}
  @keyframes shoutOut{to{opacity:0;transform:translateX(-50%) translateY(-8px);}}
  #sub{
    position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 46px);
    text-align:center;font-size:12px;color:#fff;pointer-events:none;
    text-shadow:1px 0 0 var(--ink),-1px 0 0 var(--ink),0 1px 0 var(--ink),0 -1px 0 var(--ink);
  }

  #bottom{
    position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 62px);
    display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;
  }
  .pbtn{
    pointer-events:auto;font:inherit;font-size:15px;color:var(--ink);cursor:pointer;
    background:#fff;border:4px solid var(--ink);padding:12px 22px;
    box-shadow:0 5px 0 var(--ink);
  }
  .pbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink);}
  .pbtn.pink{background:var(--pink);}
  .hide{display:none !important;}

  #meter{
    width:150px;height:14px;background:rgba(255,255,255,.7);border:3px solid var(--ink);position:relative;
  }
  #meter i{position:absolute;left:0;top:0;bottom:0;width:0;background:#7ee0c3;}
  #meter b{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--accent);}
  #meterLabel{font-size:10px;color:var(--ink);}

  #fade{position:fixed;inset:0;background:#0d0a14;pointer-events:none;transition:opacity 1.3s ease;z-index:9;}

  /* ---- 편지 ---- */
  #letter{
    position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    padding:10px;background:rgba(43,29,46,.45);
  }
  @font-face{
    font-family:'NanumGaRamYeonGgoc';
    src:url('fonts/NanumGaRamYeonGgoc.woff2') format('woff2');
    font-display:swap;
  }
  #letter .paper{
    width:100%;max-width:480px;background:var(--paper);border:4px solid var(--ink);
    box-shadow:8px 8px 0 rgba(43,29,46,.35);padding:22px 20px 18px;position:relative;
    background-image:repeating-linear-gradient(transparent 0 37px,#f3dfe6 37px 38px);
    background-position:0 22px;
    animation:open .45s steps(6);
  }
  @keyframes open{from{transform:translateY(40px) scale(.7);opacity:0;}to{transform:none;opacity:1;}}
  #letter .stamp{position:absolute;right:14px;top:-18px;background:var(--pink);border:3px solid var(--ink);padding:4px 8px;font-size:12px;}
  #ltext{white-space:pre-wrap;word-break:keep-all;font-family:'NanumGaRamYeonGgoc','Galmuri11',sans-serif;font-size:27px;line-height:38px;min-height:52vh;max-height:68vh;overflow-y:auto;color:#3a2a34;}
  #ltext .caret{display:inline-block;width:3px;height:24px;background:var(--ink);vertical-align:-2px;animation:blink 1s steps(2) infinite;}
  @keyframes blink{50%{opacity:0;}}
  #letter .row{display:flex;gap:8px;margin-top:12px;}
  #letter .row .pbtn{flex:1;font-size:13px;padding:9px 0;box-shadow:0 4px 0 var(--ink);border-width:3px;}
  #reopen{pointer-events:auto;}
</style>
</head>
<body>
<div id="app">
  <div id="screen">
    <canvas id="game"></canvas>
    <div id="title"></div>
    <div id="sub"></div>
    <div id="shout" class="hide">누나 다시 한번<br><b>생일 축하해!!</b> 🎉</div>
    <div id="bottom">
      <div id="meterWrap" class="hide" style="display:flex;flex-direction:column;align-items:center;gap:4px">
        <div id="meter"><i></i><b></b></div>
        <div id="meterLabel">🎤 바람 세기</div>
      </div>
      <button id="lightBtn" class="pbtn pink hide">🕯️ 촛불 켜기</button>
      <button id="openLetterBtn" class="pbtn pink hide">💌 편지 열어보기</button>
      <button id="reopen" class="pbtn hide">💌 편지 다시 보기</button>
    </div>
  </div>
</div>
<div id="letter" class="hide">
  <div class="paper">
    <div class="stamp">♥ 09.23</div>
    <div id="ltext"></div>
    <div class="row">
      <button class="pbtn" id="again">🎂 한 번 더</button>
      <button class="pbtn pink" id="lclose">닫기</button>
    </div>
  </div>
</div>
<div id="fade"></div>

<script>
(() => {
/* ================== 설정 ================== */
const CONFIG = {
  name: '유빈 누나',
  to: '유빈 누나에게',
  from: '성준이가',
  // ✉️ 편지 본문 — 줄바꿈 그대로 나와요
  message: `09.23부터 시작된
우리의 첫 번째 기념일,
생일 진심으로 축하해!`,
  blowThreshold: 110,    // 마이크 감도 (낮을수록 약하게 불어도 꺼짐, 0~255)
  typingSpeed: 70,       // 편지 타이핑 속도 (ms/글자)
};

/* ================== 기본 ================== */
const W = 144, CX = 72;
const K = '#2b1d2e';
const cvs = document.getElementById('game');
let ctx = cvs.getContext('2d');
const $ = id => document.getElementById(id);
const titleEl = $('title'), subEl = $('sub'), lightBtn = $('lightBtn'), reopenBtn = $('reopen');
const meterWrap = $('meterWrap'), meterBar = document.querySelector('#meter i'), meterMark = document.querySelector('#meter b');
const letterEl = $('letter'), ltext = $('ltext');

const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function rect(x, y, w, h, c) { if (c) ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function circle(cx, cy, r, c) {
  ctx.fillStyle = c;
  for (let dy = -r; dy <= r; dy++) {
    const hw = Math.floor(Math.sqrt(r * r - dy * dy) + 0.5);
    ctx.fillRect(cx - hw, cy + dy, hw * 2 + 1, 1);
  }
}
function arch(x, y, x0, y0, w, h, pad) {
  const px = x + 0.5, py = y + 0.5;
  if (px < x0 - pad || px > x0 + w + pad || py < y0 - pad || py > y0 + h) return false;
  const r = w / 2 + pad, cx = x0 + w / 2, cy = y0 + w / 2;
  if (py >= cy) return true;
  const dx = px - cx, dy = py - cy;
  return dx * dx + dy * dy <= r * r;
}

/* ================== 상태 ================== */
let H = 280, floorY = 120, tableY = 180, plateY = 230, t = 0, pt = 0;   // pt: 현재 단계 경과 시간
let phase = 'corridor';  // corridor → room → ready → lighting → wish → blow → party
let flash = 0, blackout = 1;
let dark = 0.62, light = 0;       // 방 어둠 정도, 촛불 빛 세기
let candleIn = 0;                 // 초 꽂기 진행도 (0 → 1)
let candles = [], smoke = [], sparks = [], fireworks = [], confetti = [];
const cor = document.createElement('canvas');   // 복도 (픽셀 단위 렌더)
const cctx = cor.getContext('2d');
let corImg = null;

function layout() {
  const r = cvs.getBoundingClientRect();
  if (!r.width || !r.height) return;
  H = Math.max(230, Math.round(W * r.height / r.width));
  cvs.width = W; cvs.height = H;
  ctx.imageSmoothingEnabled = false;
  buildCorridor();
  roomDirty = true;
  floorY = Math.round(H * 0.40);
  tableY = Math.round(H * 0.60);
  plateY = tableY + Math.round((H - tableY) * 0.42);
  const keep = candles[0];
  candles = [{ x: CX + 2, y: plateY - 30, lit: keep ? keep.lit : false, hp: keep ? keep.hp : 1, lean: 0, ph: rnd(0, 6.28) }];
}

/* ================== 텍스트 ================== */
function setText(title, sub = '') { titleEl.textContent = title; subEl.textContent = sub; }
function setPhase(p) {
  phase = p; pt = 0;
  lightBtn.classList.toggle('hide', p !== 'ready');
  meterWrap.classList.toggle('hide', !(p === 'blow' && micOn));
  if (p === 'ready') setText('케이크가 준비됐어!', '');
  if (p === 'lighting') setText('촛불을 켜는 중…');
  if (p === 'wish') setText('눈 감고 소원을 빌어봐', '');
  if (p === 'blow') setText('후~ 불어서 촛불을 꺼줘', micOn ? '폰 마이크에 대고 불기 · 손가락으로 쓸어도 OK' : '손가락으로 촛불을 쓸거나 화면을 꾹 눌러줘');
  if (p === 'party') setText(`생일 축하해, ${CONFIG.name}!`, '');
}

/* ================== 사운드 ================== */
let actx = null;
function ensureAudio() {
  if (!actx) { const A = window.AudioContext || window.webkitAudioContext; if (A) actx = new A(); }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(f, start, dur, type, vol) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, start);
  g.gain.exponentialRampToValueAtTime(vol, start + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  o.connect(g).connect(actx.destination);
  o.start(start); o.stop(start + dur + 0.05);
}
function chime(notes, step, vol = 0.05) {
  if (!actx) return;
  const t0 = actx.currentTime;
  notes.forEach((f, i) => tone(f, t0 + i * step, 0.22, 'square', vol));
}
function noise(dur, vol, freq) {
  if (!actx) return;
  const len = Math.floor(actx.sampleRate * dur), buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = buf; f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = vol;
  s.connect(f).connect(g).connect(actx.destination); s.start();
}
// 생일 축하 노래
const SONG_BEAT = 0.46;
const MELODY = [
  ['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],
  ['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],
  ['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',1],
  ['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',3],
];
const BASS = [
  [1,'C3',['E4','G4']],[4,'G2',['F4','B4']],[7,'G2',['F4','B4']],[10,'C3',['E4','G4']],
  [13,'C3',['E4','G4']],[16,'F2',['F4','A4']],[19,'C3',['E4','G4']],[21,'G2',['F4','B4']],[22,'C3',['E4','G4']],
];
function freq(n) {
  const i = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 }[n[0]];
  return 440 * Math.pow(2, (i + (parseInt(n.slice(1)) + 1) * 12 - 69) / 12);
}
function playSong() {
  if (!actx) return;
  const t0 = actx.currentTime + 0.2;
  let b = 0;
  MELODY.forEach(([n, d]) => {
    const st = t0 + b * SONG_BEAT, len = Math.max(0.18, d * SONG_BEAT * 0.92);
    tone(freq(n), st, len, 'square', 0.05); tone(freq(n), st, len, 'triangle', 0.09);
    b += d;
  });
  BASS.forEach(([beat, bass, chord], i) => {
    const end = i < BASS.length - 1 ? BASS[i + 1][0] : beat + 3;
    for (let k = beat; k < end; k++) {
      const st = t0 + k * SONG_BEAT;
      if ((k - beat) % 3 === 0) tone(freq(bass), st, SONG_BEAT * 0.9, 'triangle', 0.14);
      else chord.forEach(n => tone(freq(n), st, SONG_BEAT * 0.5, 'triangle', 0.035));
    }
  });
}

/* ================== 마이크 (바람 감지) ================== */
let micOn = false, stream = null, analyser = null, freqData = null, micLevel = 0;
async function startMic() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !actx) return false;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    const src = actx.createMediaStreamSource(stream);
    analyser = actx.createAnalyser();
    analyser.fftSize = 1024; analyser.smoothingTimeConstant = 0.2;
    src.connect(analyser);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    micOn = true;
  } catch (e) { micOn = false; }
  return micOn;
}
function stopMic() {
  if (stream) stream.getTracks().forEach(tr => tr.stop());
  stream = null; micOn = false; analyser = null;
}
function readMic() {
  if (!analyser) return 0;
  analyser.getByteFrequencyData(freqData);
  const hz = actx.sampleRate / analyser.fftSize, maxBin = Math.max(2, Math.ceil(700 / hz));
  let sum = 0;
  for (let i = 1; i <= maxBin; i++) sum += freqData[i];
  return sum / maxBin;         // 저주파 에너지 (0~255)
}

/* ================== 터치 대체 입력 ================== */
let holding = false, holdStart = 0, lastPt = null;
const screenEl = $('screen');
function toGame(e) {
  const r = cvs.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
function swipeAt(p) {
  if (phase !== 'blow') return;
  candles.forEach(c => {
    if (!c.lit) return;
    if (Math.abs(p.x - (c.x + 1)) < 9 && Math.abs(p.y - (c.y - 22)) < 14) { c.lean = 1; c.hp -= 0.3; }
  });
}
screenEl.addEventListener('pointerdown', e => {
  if (e.target.closest('button')) return;
  holding = true; holdStart = t; lastPt = toGame(e); swipeAt(lastPt);
});
screenEl.addEventListener('pointermove', e => {
  if (!holding) return;
  const p = toGame(e);
  // 빠르게 쓸어도 놓치지 않게 중간 지점도 검사
  if (lastPt) for (let k = 1; k <= 4; k++) swipeAt({ x: lastPt.x + (p.x - lastPt.x) * k / 4, y: lastPt.y + (p.y - lastPt.y) * k / 4 });
  lastPt = p;
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => screenEl.addEventListener(ev, () => { holding = false; lastPt = null; }));
document.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => { if (e.key === ' ') { holding = true; if (!holdStart || !e.repeat) holdStart = t; } });
addEventListener('keyup', e => { if (e.key === ' ') holding = false; });

/* ================== 버튼 흐름 ================== */
// 효과음이 무음 모드에서도 들리도록 소리 없는 오디오를 계속 재생
let keepAlive = null;
function unlockAudio() {
  if (keepAlive) return;
  try {
    const sr = 8000, n = sr, ab = new ArrayBuffer(44 + n * 2), v = new DataView(ab);
    const w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
    keepAlive = new Audio(URL.createObjectURL(new Blob([ab], { type: 'audio/wav' })));
    keepAlive.loop = true; keepAlive.setAttribute('playsinline', '');
    const p = keepAlive.play(); if (p && p.catch) p.catch(() => {});
  } catch (e) {}
}
lightBtn.addEventListener('click', async () => {
  ensureAudio();
  unlockAudio();
  lightBtn.classList.add('hide');
  setPhase('lighting');
  startMic();                 // 촛불 켜는 동안 마이크 권한 요청
});
$('again').addEventListener('click', () => {
  letterEl.classList.add('hide'); reopenBtn.classList.add('hide');
  clearInterval(typer);
  candles.forEach(c => { c.lit = false; c.hp = 1; });
  fireworks = []; confetti = [];
  dove.on = false; env.state = 'none'; crowdWas = false; openBtn.classList.add('hide');
  setPhase('ready');
});
const openBtn = $('openLetterBtn');
openBtn.addEventListener('click', () => {
  openBtn.classList.add('hide'); env.state = 'opened';
  chime([659, 880], 0.08, 0.04);
  openLetter();
});
// 편지를 닫으면: 맞은편 캐릭터가 두 손을 모아 외침!
const shoutEl = $('shout');
let shoutT = -1;
$('lclose').addEventListener('click', () => {
  letterEl.classList.add('hide');
  shoutT = 0;
  setText('이제 디엠하쟈!!!', '');   // 편지를 읽고 닫으면 상단 문구 변경
  const r = cvs.getBoundingClientRect(), k = r.height / H;
  shoutEl.style.top = Math.max(56, (tableY - 64) * k - 118) + 'px';
  shoutEl.classList.remove('hide');
  shoutEl.style.animation = 'none'; void shoutEl.offsetWidth; shoutEl.style.animation = '';   // 다시 눌러도 처음부터
  chime([523, 659, 784, 1047, 1319], 0.07, 0.04);
  for (let i = 0; i < 24; i++) sparks.push({ x: CX + rnd(-30, 30), y: tableY - rnd(30, 70), vx: rnd(-40, 40), vy: rnd(-50, -10), life: rnd(0.5, 1.1), c: ['#fff6d6', '#ffd166', '#ff9ab8'][i % 3] });
  setTimeout(() => { shoutEl.classList.add('hide'); reopenBtn.classList.remove('hide'); shoutT = -1; }, 4000);
});
reopenBtn.addEventListener('click', () => { reopenBtn.classList.add('hide'); openLetter(); });

let typer = null;
function openLetter() {
  letterEl.classList.remove('hide');
  const full = `${CONFIG.to}\n\n${CONFIG.message}\n\n${' '.repeat(12)}- ${CONFIG.from} ♥`;
  let i = 0;
  ltext.innerHTML = '<span class="caret"></span>';
  clearInterval(typer);
  typer = setInterval(() => {
    i++;
    ltext.textContent = full.slice(0, i);
    const c = document.createElement('span'); c.className = 'caret'; ltext.appendChild(c);
    ltext.scrollTop = ltext.scrollHeight;
    if (i >= full.length) clearInterval(typer);
  }, CONFIG.typingSpeed);
}

/* ================== 업데이트 ================== */
function update(dt) {
  t += dt; pt += dt;
  if (shoutT >= 0) shoutT += dt;

  // 등장: 어두운 복도를 걸어서 → 방 도착
  if (phase === 'corridor') {
    blackout = Math.max(0, 1 - pt / 1.3);
    if (pt > CORRIDOR_TIME) blackout = Math.min(1, (pt - CORRIDOR_TIME) / 0.5);
    if (pt > CORRIDOR_TIME + 0.55) { setPhase('room'); blackout = 1; }
  } else if (phase === 'room') {
    blackout = Math.max(0, 1 - pt / 1.0);
    if (pt > 1.4) setPhase('ready');
  } else blackout = Math.max(0, blackout - dt * 2);

  // 초를 꽂고 → 불 붙이기
  if (phase === 'lighting') {
    if (candleIn < 1) {
      candleIn = Math.min(1, candleIn + dt / 0.7);
      if (candleIn === 1) { noise(0.12, 0.3, 400); for (let i = 0; i < 8; i++) sparks.push({ x: candles[0].x + 1 + rnd(-4, 4), y: candles[0].y, vx: rnd(-20, 20), vy: rnd(-30, -10), life: rnd(0.3, 0.6), c: '#f6d58a' }); pt = 0; }
    } else if (pt > 0.5 && !candles[0].lit) {
      candles[0].lit = true;
      tone(880, actx.currentTime, 0.18, 'triangle', 0.07); tone(1320, actx.currentTime + 0.08, 0.2, 'triangle', 0.05);
      for (let i = 0; i < 10; i++) sparks.push({ x: candles[0].x + 1, y: candles[0].y - 21, vx: rnd(-25, 25), vy: rnd(-35, 5), life: rnd(0.3, 0.7), c: ['#ffd166', '#fff6d6'][i % 2] });
    } else if (candles[0].lit && pt > 2) setPhase('wish');
  }
  if (phase === 'wish' && pt > 3) setPhase('blow');

  // 조명: 평소엔 어둡고, 촛불이 켜지면 살짝 밝아짐, 축하 땐 환하게
  const litNow = candles.some(c => c.lit);
  light += ((litNow ? 1 : 0) - light) * Math.min(1, dt * 2);
  const darkTarget = phase === 'party' ? (pt < 0.5 ? 0.75 : 0.22) : 0.62;
  dark += (darkTarget - dark) * Math.min(1, dt * (phase === 'party' ? 2.5 : 1.5));
  flash = Math.max(0, flash - dt * 1.6);

  // 바람 세기
  let strength = 0;
  if (micOn) {
    micLevel = readMic();
    const over = micLevel - CONFIG.blowThreshold;
    if (over > 0) strength = clamp(0.35 + over / 60, 0, 1);
  }
  if (holding && t - holdStart > 0.35) strength = Math.max(strength, 0.75);
  if (phase === 'blow') {
    meterBar.style.width = clamp(micLevel / 255 * 100, 0, 100) + '%';
    meterBar.style.background = strength > 0 ? '#ff9ab8' : '#7ee0c3';
    meterMark.style.left = (CONFIG.blowThreshold / 255 * 100) + '%';
  }

  candles.forEach(c => {
    if (!c.lit) return;
    const target = phase === 'blow' ? strength : 0;
    c.lean += (target - c.lean) * Math.min(1, dt * 8);
  });
  if (phase === 'blow' && strength > 0) {
    const lit = candles.filter(c => c.lit);
    if (lit.length) lit[0].hp -= strength * dt * 1.4;
  }
  candles.forEach(c => {
    if (c.lit && c.hp <= 0) {
      c.lit = false;
      noise(0.25, 0.25, 900);
      for (let i = 0; i < 10; i++) smoke.push({ x: c.x + 1 + rnd(-2, 2), y: c.y - 18, vx: rnd(-4, 4) - c.lean * 6, vy: rnd(-14, -8), life: rnd(1, 1.8) });
    }
  });
  if (phase === 'blow' && candles.every(c => !c.lit)) {
    setPhase('party');
    stopMic();
    chime([784, 988, 1175, 1568], 0.08, 0.04);   // 짧은 '짠' 효과음
    dove.on = true; dove.t = 0; env.state = 'carried';
  }

  // 파티
  if (phase === 'party') {
    if (Math.random() < dt * 2.2 && pt < 2.2) launchFirework();
    updateDove(dt);
    if (confetti.length < 90 && pt < 12) for (let i = 0; i < 2; i++) confetti.push({ x: rnd(0, W), y: -4, vy: rnd(18, 34), ph: rnd(0, 6.28), c: ['#ff9ab8', '#ffd166', '#7ee0c3', '#8ecbff', '#ff5c8a', '#fff'][Math.floor(rnd(0, 6))] });
  }

  // 파티클
  fireworks.forEach(f => {
    if (f.rocket) {
      f.y += f.vy * dt; f.vy += 40 * dt;
      if (f.vy > -12) { f.dead = true; explode(f.x, f.y, f.c); }
    } else {
      f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 28 * dt; f.vx *= 0.985; f.life -= dt;
      if (f.life <= 0) f.dead = true;
    }
  });
  fireworks = fireworks.filter(f => !f.dead);
  confetti.forEach(c => { c.y += c.vy * dt; c.x += Math.sin(t * 3 + c.ph) * 10 * dt; });
  confetti = confetti.filter(c => c.y < H + 4);
  smoke.forEach(s => { s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt; });
  smoke = smoke.filter(s => s.life > 0);
  sparks.forEach(s => { s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 60 * dt; s.life -= dt; });
  sparks = sparks.filter(s => s.life > 0);
}
function launchFirework() {
  const colors = ['#ff5c8a', '#ffd166', '#7ee0c3', '#8ecbff', '#ff9ab8', '#c89bff'];
  fireworks.push({ rocket: true, x: rnd(20, W - 20), y: H, vy: -rnd(120, 150), c: colors[Math.floor(rnd(0, colors.length))] });
}
function explode(x, y, c) {
  const n = 34;
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2, sp = rnd(26, 40);
    fireworks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rnd(0.9, 1.4), c: Math.random() < 0.25 ? '#fff' : c });
  }
}

/* ================== 흰 비둘기 + 편지 ================== */
const DOVE_A = ["K...................K","KK.................KK","KWK...............KWK","KWWK.....KKK.....KWWK",".KWWK...KWWWK...KWWK.",".KWWWK.KWKWKWK.KWWWK.","..KWWWKKWWOWWKKWWWK..","...KWWWWWWWWWWWWWK...","....KKWWWWWWWWWKK....","......KWWWWWWWK......",".......KWWKWWK.......","........KK.KK........"];
const DOVE_B = [".....................",".....................",".....................",".........KKK.........","........KWWWK........",".......KWKWKWK.......","..KKKKKKWWOWWKKKKKK..",".KWWWWWWWWWWWWWWWWWK.","KWWWWKKWWWWWWWKKWWWWK","KWWK..KWWWWWWWK..KWWK","KK.....KWWKWWK.....KK","........KK.KK........"];
const ENV = ["KKKKKKKKKKKK","KfWWWWWWWWfK","KWfWWWWWWfWK","KWWfWWWWfWWK","KWWWfRRfWWWK","KWWWWRRWWWWK","KWWWWWWWWWWK","KKKKKKKKKKKK"];
const DOVE_PAL = { K: '#5a6072', W: '#ffffff', O: '#f2a65a', f: '#d9c7a4', R: '#d8243e' };
function spriteCanvas(map, pal) {
  const cv = document.createElement('canvas'); cv.width = map[0].length; cv.height = map.length;
  const g = cv.getContext('2d');
  map.forEach((row, r) => { for (let c = 0; c < row.length; c++) if (row[c] !== '.') { g.fillStyle = pal[row[c]] || '#fff'; g.fillRect(c, r, 1, 1); } });
  return cv;
}
const doveA = spriteCanvas(DOVE_A, DOVE_PAL), doveB = spriteCanvas(DOVE_B, DOVE_PAL);
const envCv = spriteCanvas(ENV, { ...DOVE_PAL, W: '#fff4e0' });
const dove = { on: false, t: 0, x: 0, y: 0, s: 1 };
const env = { state: 'none', x: 0, y: 0, s: 1, vy: 0 };   // none → carried → falling → landed → opened
const ease = p => p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;

function updateDove(dt) {
  if (!dove.on) return;
  dove.t += dt;
  const T = dove.t - CHEER_TIME - 1.2;       // 사람들이 퇴장할 즈음 창문에서 등장
  const start = { x: CX + 4, y: 60, s: 0.3 }, hover = { x: CX - 4, y: plateY - 2, s: 2.4 }, away = { x: CX - 90, y: -30, s: 1.2 };
  if (T < 0) { dove.s = 0; return; }
  if (T < 3) {                               // 창문에서 날아옴 (점점 커짐)
    const p = ease(T / 3);
    dove.x = start.x + (hover.x - start.x) * p + Math.sin(T * 3) * 6 * (1 - p);
    dove.y = start.y + (hover.y - start.y) * p;
    dove.s = start.s + (hover.s - start.s) * p;
  } else if (T < 4) {                        // 앞에서 잠깐 머무름
    dove.x = hover.x; dove.y = hover.y + Math.sin(T * 6) * 1.5; dove.s = hover.s;
    if (T > 3.6 && env.state === 'carried') { env.state = 'falling'; env.vy = 0; noise(0.1, 0.12, 1500); }
  } else if (T < 6.2) {                      // 다시 날아감
    const p = ease((T - 4) / 2.2);
    dove.x = hover.x + (away.x - hover.x) * p; dove.y = hover.y + (away.y - hover.y) * p; dove.s = hover.s + (away.s - hover.s) * p;
  } else dove.on = false;

  if (env.state === 'carried') { env.x = dove.x; env.y = dove.y + 10 * dove.s; env.s = dove.s * 0.8; }
  if (env.state === 'falling') {
    const target = plateY + 15;
    env.vy += 260 * dt; env.y += env.vy * dt; env.s += (2 - env.s) * Math.min(1, dt * 4);
    if (env.y >= target) {
      env.y = target; env.state = 'landed'; env.s = 2;
      noise(0.08, 0.2, 600);
      for (let i = 0; i < 12; i++) sparks.push({ x: env.x + rnd(-12, 12), y: env.y - rnd(0, 6), vx: rnd(-25, 25), vy: rnd(-40, -10), life: rnd(0.4, 0.9), c: ['#fff6d6', '#ffd166'][i % 2] });
      setText('편지가 도착했어!', '');
      setTimeout(() => { if (env.state === 'landed') openBtn.classList.remove('hide'); }, 500);
    }

}
function drawSprite2(cv, x, y, s) {
  const w = Math.max(1, Math.round(cv.width * s)), h = Math.max(1, Math.round(cv.height * s));
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(cv, Math.round(x - w / 2), Math.round(y - h / 2), w, h);
}
function drawDove() {
  if (env.state === 'landed') {
    const bob = Math.round(Math.sin(t * 3) * 1);
    ctx.globalAlpha = 0.3; ellipse(ctx, Math.round(env.x), Math.round(env.y) + 9, 12, 2, '#3a2a30'); ctx.globalAlpha = 1;
    drawSprite2(envCv, env.x, env.y + bob, env.s);
    if (Math.sin(t * 3) > 0.5) { rect(Math.round(env.x) + 12, Math.round(env.y) - 10, 1, 3, '#fff'); rect(Math.round(env.x) + 11, Math.round(env.y) - 9, 3, 1, '#fff'); }
  }
  if (env.state === 'carried' || env.state === 'falling') { if (dove.s > 0 || env.state === 'falling') drawSprite2(envCv, env.x, env.y, env.s); }
  if (dove.on && dove.s > 0) {
    const flap = Math.floor(t / 0.13) % 2;
    drawSprite2(flap ? doveA : doveB, dove.x, dove.y, dove.s);
  }
}

/* ================== 그리기 도우미 ================== */
function fillPoly(g, pts, color) {            // 픽셀 단위 다각형 채우기
  g.fillStyle = color;
  const ys = pts.map(p => p[1]), y0 = Math.floor(Math.min(...ys)), y1 = Math.ceil(Math.max(...ys));
  for (let y = y0; y < y1; y++) {
    const yc = y + 0.5, xs = [];
    for (let i = 0; i < pts.length; i++) {
      const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % pts.length];
      if ((ay <= yc && by > yc) || (by <= yc && ay > yc)) xs.push(ax + (yc - ay) / (by - ay) * (bx - ax));
    }
    xs.sort((a, b) => a - b);
    for (let k = 0; k + 1 < xs.length; k += 2) g.fillRect(Math.round(xs[k]), y, Math.round(xs[k + 1]) - Math.round(xs[k]), 1);
  }
}
function ellipse(g, cx, cy, rx, ry, color) {
  g.fillStyle = color;
  for (let dy = -ry; dy <= ry; dy++) {
    const hw = Math.round(rx * Math.sqrt(1 - (dy * dy) / (ry * ry)));
    g.fillRect(cx - hw, cy + dy, hw * 2 + 1, 1);
  }
}

/* ================== 어두운 복도 (1인칭, 픽셀 단위 원근 렌더) ================== */
const CORRIDOR_TIME = 6.5, F = 46, ZEND = 14;
const TORCHES = Array.from({ length: 6 }, (_, k) => ({ a: 1.8 + k * 2.1, s: k % 2 ? 1 : -1, ph: rnd(0, 6) }));
function hash(a, b) { const v = Math.sin(a * 127.1 + b * 311.7) * 43758.5; return v - Math.floor(v); }
// 성능: 복도는 절반 해상도로 그리고, 픽셀마다 변하지 않는 원근 정보는 미리 계산
const CR = 2;
let cw = 0, chh = 0, geoZ, geoT, geoX, geoY, geoDX, geoDY;
function buildCorridor() {
  cw = Math.ceil(W / CR); chh = Math.ceil(H / CR) + 2;
  cor.width = cw; cor.height = chh;
  corImg = cctx.createImageData(cw, chh);
  const n = cw * chh, VY = H * 0.45;
  geoZ = new Float32Array(n); geoT = new Uint8Array(n); geoX = new Float32Array(n); geoY = new Float32Array(n);
  geoDX = new Float32Array(n); geoDY = new Float32Array(n);
  for (let y = 0; y < chh; y++) for (let x = 0; x < cw; x++) {
    const i = y * cw + x, dx = (x + 0.5) * CR - CX, dy = (y + 0.5) * CR - VY - CR;
    const zw = F / Math.max(0.001, Math.abs(dx));
    const zf = dy > 0 ? F * 0.8 / dy : dy < 0 ? F / -dy : 1e9;
    geoDX[i] = dx; geoDY[i] = dy;
    if (zw < zf) { geoZ[i] = zw; geoT[i] = 0; geoX[i] = Math.sign(dx); geoY[i] = dy * zw / F; }      // 벽
    else if (dy > 0) { geoZ[i] = zf; geoT[i] = 1; geoX[i] = dx * zf / F; geoY[i] = 0.8; }           // 바닥
    else { geoZ[i] = zf; geoT[i] = 2; geoX[i] = dx * zf / F; geoY[i] = -1; }                          // 천장
  }
}
function drawCorridor() {
  const p = clamp(pt / CORRIDOR_TIME, 0, 1);
  const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
  const off = e * (ZEND - 2.6);
  const bob = Math.round(Math.sin(p * Math.PI * 10) * 0.8);   // 잔잔한 발걸음
  const VY = Math.round(H * 0.45);
  const zE = ZEND - off;
  const doorGlow = 0.35 + 0.65 * p;
  const tl = TORCHES.map(tc => ({ z: tc.a - off, x: tc.s * 0.92, y: -0.25, f: 0.92 + 0.08 * Math.sin(t * 5 + tc.ph) })).filter(tc => tc.z > -1 && tc.z < zE + 1);
  const d = corImg.data, n = cw * chh;
  for (let i = 0; i < n; i++) {
    let z = geoZ[i], X = geoX[i], Y = geoY[i], r, g, b;
    const i4 = i * 4;
    if (z > zE) {                                   // 복도 끝 (문)
      z = zE; X = geoDX[i] * z / F; Y = geoDY[i] * z / F;
      if (X > -0.42 && X < 0.42 && Y > -0.75 && Y < 0.8) {
        const k = doorGlow * (X < -0.38 || X > 0.38 || Y < -0.7 ? 0.5 : 1);
        d[i4] = 255 * k; d[i4 + 1] = 196 * k; d[i4 + 2] = 120 * k; d[i4 + 3] = 255; continue;
      }
      r = 70; g = 60; b = 84;
    } else {
      const A = z + off, T = geoT[i];
      if (T === 0) {                                // 돌벽돌
        const yy = (Y + 1) * 4.5, row = Math.floor(yy), u = A * 1.6 + (row & 1) * 0.5, fu = u - Math.floor(u);
        if (fu < 0.08 || yy - row < 0.12) { r = 34; g = 29; b = 42; }
        else { const v = hash(Math.floor(u), row) * 14; r = 76 + v; g = 66 + v; b = 90 + v; }
      } else if (T === 1) {                         // 바닥 + 카펫
        const ax = X < 0 ? -X : X;
        if (ax < 0.36) { const st = Math.floor(A * 3) & 1; r = 78 + st * 6; g = 16; b = 30; }
        else if (ax < 0.4) { r = 150; g = 112; b = 44; }
        else { const ch = (Math.floor(A * 1.5) + Math.floor(X * 3)) & 1; r = ch ? 58 : 48; g = ch ? 50 : 42; b = ch ? 66 : 56; }
      } else {                                      // 천장
        if ((A * 0.8 - Math.floor(A * 0.8)) < 0.14) { r = 58; g = 40; b = 34; } else { r = 30; g = 26; b = 38; }
      }
    }
    let Lw = 0;
    for (let k = 0; k < tl.length; k++) {
      const tc = tl[k], ex = X - tc.x, ey = Y - tc.y, ez = z - tc.z;
      Lw += tc.f * 0.8 / (1 + (ex * ex + ey * ey + ez * ez) * 2.2);
    }
    const dz = zE - z, Ld = 0.55 * doorGlow / (1 + dz * dz * 0.06);
    const fog = 2.1 / (1 + z * 0.06);
    d[i4]     = r * (0.2 + Lw * 1.3 + Ld * 1.2) * fog;
    d[i4 + 1] = g * (0.2 + Lw * 0.95 + Ld) * fog;
    d[i4 + 2] = b * (0.2 + Lw * 0.55 + Ld * 0.7) * fog;
    d[i4 + 3] = 255;
  }
  cctx.putImageData(corImg, 0, 0);
  rect(0, 0, W, H, '#0d0a14');
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(cor, 0, bob - CR, cw * CR, chh * CR);
  // 횃불 (가까울수록 크게)
  tl.slice().sort((a, b) => b.z - a.z).forEach(tc => {
    if (tc.z < 0.35) return;
    const sx = CX + tc.x * F / tc.z, sy = VY + bob + tc.y * F / tc.z, s = clamp(F / tc.z / 16, 0.4, 4);
    const fl = Math.sin(t * 16 + tc.a) > 0 ? 1 : 0;
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.5; circle(Math.round(sx), Math.round(sy - 3 * s), Math.round(7 * s), '#3a1e06');
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    rect(Math.round(sx - 1 * s), Math.round(sy), Math.max(1, Math.round(2 * s)), Math.max(1, Math.round(4 * s)), '#3b2a22');
    rect(Math.round(sx - 1.5 * s), Math.round(sy - 1 * s), Math.max(1, Math.round(3 * s)), Math.max(1, Math.round(1.5 * s)), '#6a4a30');
    rect(Math.round(sx - 1 * s), Math.round(sy - (4 + fl) * s), Math.max(1, Math.round(2 * s)), Math.max(1, Math.round((3 + fl) * s)), '#ff8a3d');
    rect(Math.round(sx - 0.5 * s), Math.round(sy - 3 * s), Math.max(1, Math.round(1 * s)), Math.max(1, Math.round(2 * s)), '#ffe066');
  });
}

/* ================== 액자 그림 ================== */
const FONT3 = {   // 3x5 도트 글자
  S: ['111', '100', '111', '001', '111'], E: ['111', '100', '111', '100', '111'], P: ['111', '101', '111', '100', '100'],
  '2': ['111', '001', '111', '100', '111'], '3': ['111', '001', '111', '001', '111'], '9': ['111', '101', '111', '001', '111'],
};
function text3(str, x, y, c, s = 1) {
  [...str].forEach((ch, i) => (FONT3[ch] || []).forEach((row, r) => [...row].forEach((b, k) => { if (b === '1') rect(x + i * 4 * s + k * s, y + r * s, s, s, c); })));
}
function frame(x, y, w, h) {
  rect(x - 1, y - 1, w + 2, h + 2, '#2a1a1c'); rect(x, y, w, h, '#b8892e');
  rect(x + 1, y + 1, w - 2, 1, '#e8c060'); rect(x + 1, y + h - 2, w - 2, 1, '#8a6420');
}
function drawCalendarFrame(x, y) {

  const px = x + 2, py = y + 2, W2 = 22, H2 = 28, mid = px + 11;         // 가운데 기준선

  rect(px, py, W2, 8, '#c8243e'); rect(px, py + 7, W2, 1, '#a81c34');
  text3('SEP', mid - 5, py + 2, '#ffffff');                               // 11px 폭 → 정가운데
  rect(px + 5, py - 1, 1, 3, '#8a8a9a'); rect(px + 16, py - 1, 1, 3, '#8a8a9a');   // 스프링 링
  // 날짜 칸: 7칸 × 4줄, 가운데 정렬
  const gx = mid - 10;
  for (let r = 0; r < 4; r++) for (let c = 0; c < 7; c++) {
    const col = c === 0 ? '#e88a9a' : c === 6 ? '#8ab0e0' : '#c9c0cc';
    rect(gx + c * 3, py + 10 + r * 2, 2, 1, (r === 3 && c === 3) ? '#e8243e' : col);   // 23일 칸은 빨강
  }

function drawFlames(oy) {
  candles.forEach(c => {
    if (!c.lit) return;
    const bx = c.x + 1, by = c.y + oy - 20;
    // 1인칭: 불면 불꽃이 작아지고 좌우로 파르르 떨림
    const flick = Math.sin(t * 17 + c.ph) > 0.2 ? 1 : 0;
    const weak = clamp(c.lean, 0, 1);
    const shake = weak > 0.15 ? Math.round(Math.sin(t * 45 + c.ph) * (1 + weak * 2)) : 0;
    const h = Math.max(3, Math.round(9 + flick - weak * 5 - (c.hp < 0.5 ? 2 : 0)));
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.45 * (1 - weak * 0.5); circle(bx, by - 4, 9, '#3a2408');
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    for (let k = 0; k < h; k++) {
      const f = k / h, w = f < 0.25 ? 3 : f < 0.55 ? 5 : f < 0.8 ? 3 : 1;
      const off = Math.round(shake * f);
      rect(bx - (w >> 1) + off, by - k, w, 1, f < 0.2 ? '#ff6a2a' : f < 0.5 ? '#ff9a3d' : '#ffd166');
    }
    rect(bx + Math.round(shake * 0.3), by - Math.round(h * 0.35), 1, Math.max(1, Math.round(h * 0.3)), '#fff6d6');
    rect(bx, by + 1, 1, 1, '#4a86ff');   // 불꽃 아래 파란 심지 빛
  });
}

  handCv.width = HAND[0].length; handCv.height = HAND.length;
  const g = handCv.getContext('2d');
  HAND.forEach((row, r) => { for (let c = 0; c < row.length; c++) { const ch = row[c]; if (ch !== '.') { g.fillStyle = HAND_PAL[ch]; g.fillRect(c, r, 1, 1); } } });
})();
const HAND_SCALE = 2;
function drawHands(oy) {
  const w = handCv.width * HAND_SCALE, h = handCv.height * HAND_SCALE;
  const y = H - h + 6 + oy;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(handCv, -8, y, w, h);                       // 왼손
  ctx.save(); ctx.translate(W, 0); ctx.scale(-1, 1);         // 오른손 (좌우 반전)
  ctx.drawImage(handCv, -8, y, w, h);
  ctx.restore();
}

// 테이블 건너편에 앉은 남자친구 (웃으면서 몸을 좌우로 흔듦)
const BOY = [
  "........K.KK.K.KK.......",
  ".......KHKHHKHKHHK......",
  ".....KKHHHHHHHHHHHKK....",
  "....KHHHHhHHHHHhHHHHK...",
  "...KHHhHHHHHHHHHHHhHHK..",
  "...KHHHHHHHHHHHHHHHHHK..",
  "...KHHHHHHHHHHHHHHHHHK..",
  "...KHHHSHHHHSHHHSHHHHK..",
  "...KHHSSSHSSSSHSSSSHHK..",
  "...KHSSSwESSSSSwESSSHK..",
  "..KSHSSSEESSSSSEESSSHSK.",
  "..KsHSSSEESSSSSEESSSHsK.",
  "...KSSCCSSSSSSSSSSCCSK..",
  "...KSSSSSSKSSSKSSSSSSK..",
  "....KSSSSSSKKKSSSSSSK...",
  "....KSSSSSSSSSSSSSSSK...",
  ".....KSSSSSSSSSSSSSK....",
  "......KKSSSSSSSSSKK.....",
  "........KSSSSSSSK.......",
  "........KSSSSSSSK.......",
  ".....KKKKWWWWWWWKKKK....",
  "...KKNNNNKWWWWWKNNNNKK..",
  "..KNNNNNNNKWWWKNNNNNNNK.",
  ".KNNNNNNNNNKWKNNNNNNNNNK",
  ".KNnNNNNNNNNNNNNNNNNnNNK",
  ".KNnNNNNNNNNNNNNNNNNnNNK",
  ".KNnNNNNNNNNNNNNNNNNnNNK",
  ".KNnNNNNNNNNNNNNNNNNnNNK",
  ".KNnNNNNNNNNNNNNNNNNnNNK",
  ".KNnNNNNNNNNNNNNNNNNnNNK",
];
const BOY_PAL = { E: '#1e1624', w: '#ffffff', b: '#2a2430', K: '#1e1624', H: '#1b1820', h: '#3a3542', S: '#f3cfb3', s: '#e2b596', C: '#f59aa0', W: '#f4f1ea', N: '#2e3a5c', n: '#25304c' };
const BOY_SCALE = 2;       // 캐릭터 크기 배율
const boyCv = document.createElement('canvas'), boyBlink = document.createElement('canvas');
function buildBoy(cv, blink) {
  cv.width = BOY[0].length; cv.height = BOY.length;
  const g = cv.getContext('2d');
  BOY.forEach((row, r) => { for (let c = 0; c < row.length; c++) {
    let ch = row[c];
    if (blink && (ch === 'E' || ch === 'w')) ch = r === 11 ? 'E' : 'S';   // 눈 감으면 한 줄만 남음   // 눈 감은 모양
    if (ch !== '.') { g.fillStyle = BOY_PAL[ch]; g.fillRect(c, r, 1, 1); }
  } });
}
buildBoy(boyCv, false); buildBoy(boyBlink, true);
/* ================== 축하 장면: 박수 + 시종/하객 등장 ================== */
const CHEER_TIME = 4.2;                        // 사람들이 축하하는 시간(초) → 이후 비둘기
const cheering = () => phase === 'party' && dove.on && dove.t > 0.25 && dove.t < CHEER_TIME;
let crowdWas = false;
const CROWD = [
  // x, 발 위치(테이블 기준), 종류, 머리색, 옷색
  { x: 14,  dy: 6,  kind: 'butler', hair: '#2b2230' },
  { x: 38,  dy: 4,  kind: 'maid',   hair: '#6a3e2a' },
  { x: 106, dy: 4,  kind: 'guest',  hair: '#3a2a2a', top: '#c86aa8' },
  { x: 130, dy: 6,  kind: 'maid',   hair: '#2b2230' },
  { x: 26,  dy: -12, kind: 'guest', hair: '#e0b04a', top: '#3fa5a0', far: true },
  { x: 50,  dy: -14, kind: 'butler', hair: '#8a5a3a', far: true },
  { x: 94,  dy: -14, kind: 'guest', hair: '#c9c2d4', top: '#6a7ad8', far: true },
  { x: 118, dy: -12, kind: 'guest', hair: '#5a3a2a', top: '#d8a23a', far: true },
];
function drawPerson(p, i, mode) {
  const x = p.x, fy = tableY + p.dy;
  const walking = mode === 'exit';
  const ph = t * 7 + i * 1.3;
  const jump = walking ? (Math.floor(t * 10 + i) % 2) : Math.max(0, Math.round(Math.sin(ph) * 2));
  const up = !walking && Math.sin(ph) > 0;             // 만세 / 내림 번갈아 (나갈 땐 손 흔들며 걸음)
  const y = fy - jump, top = p.kind === 'butler' ? '#2a2432' : p.kind === 'maid' ? '#2e2638' : p.top;
  const O = '#3a2a3a', S = '#f6d7c0';
  // 몸
  rect(x - 5, y - 13, 11, 14, O); rect(x - 4, y - 12, 9, 13, top);
  if (p.kind === 'butler') { rect(x - 1, y - 12, 3, 6, '#f4f1ea'); rect(x - 1, y - 12, 3, 1, '#c8243e'); }
  if (p.kind === 'maid') { rect(x - 3, y - 8, 7, 9, '#f4f1ea'); rect(x - 4, y - 12, 9, 1, '#f4f1ea'); }
  if (p.kind === 'guest') { rect(x - 4, y - 12, 9, 1, '#f5d38a'); }
  // 팔
  if (up) { rect(x - 7, y - 20, 3, 8, O); rect(x - 6, y - 19, 1, 6, top); rect(x - 7, y - 21, 3, 2, S);
            rect(x + 5, y - 20, 3, 8, O); rect(x + 6, y - 19, 1, 6, top); rect(x + 5, y - 21, 3, 2, S); }
  else if (walking) {                                   // 한 손 흔들며 퇴장
    const wv = Math.floor(t * 6 + i) % 2;
    const hx = p.dir < 0 ? x + 5 : x - 7;
    rect(hx, y - 19, 3, 7, O); rect(hx + 1, y - 18, 1, 5, top); rect(hx + (wv ? 1 : -1), y - 21, 3, 2, S);
    const ox2 = p.dir < 0 ? x - 7 : x + 5;
    rect(ox2, y - 11, 3, 8, O); rect(ox2 + 1, y - 10, 1, 6, top);
  }
  else    { rect(x - 7, y - 11, 3, 8, O); rect(x - 6, y - 10, 1, 6, top); rect(x - 6, y - 4, 1, 1, S);
            rect(x + 5, y - 11, 3, 8, O); rect(x + 6, y - 10, 1, 6, top); rect(x + 6, y - 4, 1, 1, S); }
  // 머리
  circle(x, y - 18, 5, O); circle(x, y - 18, 4, S);
  rect(x - 4, y - 23, 9, 3, p.hair); rect(x - 5, y - 21, 2, 4, p.hair); rect(x + 4, y - 21, 2, 4, p.hair);
  if (p.kind === 'maid') { rect(x - 3, y - 24, 7, 1, '#f4f1ea'); rect(x - 5, y - 17, 1, 5, p.hair); rect(x + 5, y - 17, 1, 5, p.hair); }
  // 웃는 눈 (반달) + 작은 미소 + 볼터치
  const E = '#5a3a44';
  [[-3, 0], [-2, -1], [-1, 0], [1, 0], [2, -1], [3, 0]].forEach(([dx, dy]) => rect(x + dx, y - 18 + dy, 1, 1, E));   // ^ ^
  rect(x - 1, y - 16, 3, 1, '#c86a78'); rect(x, y - 15, 1, 1, '#e58a96');   // 활짝 웃는 입
  rect(x - 4, y - 17, 1, 1, '#f7a8b4'); rect(x + 4, y - 17, 1, 1, '#f7a8b4');
}
function poof(xs) {
  xs.forEach(p => { for (let k = 0; k < 7; k++) sparks.push({ x: p.x + rnd(-6, 6), y: tableY + p.dy - rnd(4, 24), vx: rnd(-20, 20), vy: rnd(-25, 5), life: rnd(0.4, 0.8), c: ['#ffffff', '#f5d38a', '#ffb3c7'][k % 3] }); });
}
const personCv = document.createElement('canvas'); personCv.width = 20; personCv.height = 32;
const personCtx = personCv.getContext('2d');
function drawPersonBig(p, i, scale, mode, ox = 0) {
  // 작은 캔버스에 그린 뒤 확대 (도트 유지)
  const main = ctx; ctx = personCtx;
  ctx.clearRect(0, 0, 20, 32);
  const saveTable = tableY; tableY = 0;
  drawPerson({ ...p, x: 10, dy: 31 }, i, mode);
  tableY = saveTable; ctx = main;
  const w = Math.round(20 * scale), h = Math.round(32 * scale);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(personCv, Math.round(p.x + ox - w / 2), Math.round(tableY + p.dy - h + 2), w, h);
}
const EXIT_TIME = 2.2;                         // 축하 후 양옆으로 걸어 나가는 시간
function crowdMode() {
  if (!(phase === 'party' && dove.on)) return 'none';
  const d = dove.t;
  if (d < 0.25) return 'none';
  if (d < CHEER_TIME) return 'cheer';
  if (d < CHEER_TIME + EXIT_TIME + 0.4) return 'exit';
  return 'none';
}
function drawCrowd() {
  const mode = crowdMode();
  if (mode === 'cheer' && !crowdWas) poof(CROWD);                        // 등장할 때만 펑!
  crowdWas = mode !== 'none';
  if (mode === 'none') return;
  const draw = (p, i, sc) => {
    const dir = p.x < CX ? -1 : 1;
    let ox = 0;
    if (mode === 'exit') {                                               // 순서대로 양옆 문밖으로 퇴장
      const te = clamp((dove.t - CHEER_TIME - i * 0.08) / EXIT_TIME, 0, 1);
      ox = dir * te * te * 110;
    }
    drawPersonBig({ ...p, dir }, i, sc, mode, ox);
  };
  CROWD.filter(p => p.far).forEach((p, i) => draw(p, i + 7, 1.5));
  CROWD.filter(p => !p.far).forEach((p, i) => draw(p, i, 2));
}

function drawBoyShout(ox0, oy0, w, h) {
  // 외치는 모션: 앞으로 살짝 튀어나오듯 + 부르르 떨림, 입 크게, 두 손을 입가에 모음
  const shake = (shoutT > 0.35 && shoutT < 0.95) ? (Math.floor(t * 24) % 2 ? 1 : -1) : 0;   // 잠깐만 부르르
  const lift = shoutT < 0.35 ? Math.round(shoutT / 0.35 * 3) : 3;
  const ox = ox0 + shake, oy = oy0 - lift;
  ctx.drawImage(boyCv, ox, oy, w, h);
  const P = (c, r, cw, ch, col) => rect(ox + c * 2, oy + r * 2, cw * 2, ch * 2, col);
  const SK = '#f3cfb3', OL = '#1e1624';
  // 질끈 감은 눈 > <
  P(8, 9, 2, 3, SK); P(15, 9, 2, 3, SK);
  P(8, 9, 1, 1, OL); P(9, 10, 1, 1, OL); P(8, 11, 1, 1, OL);
  P(16, 9, 1, 1, OL); P(15, 10, 1, 1, OL); P(16, 11, 1, 1, OL);
  // 크게 벌린 입
  P(10, 13, 5, 2, SK);
  P(11, 13, 3, 3, OL); P(12, 14, 1, 1, '#c8243e'); P(11, 13, 3, 1, '#5a1a24');
  // 입가에 모은 두 손 + 소매
  [[4, 1], [17, -1]].forEach(([oc, d]) => {           // 얼굴 양옆에서 입 쪽으로 모은 손 (메가폰 손)
    P(oc, 11, 4, 6, OL);
    P(oc + 1, 12, 2, 4, '#f0c2a6');
    P(d > 0 ? oc + 3 : oc, 12, 1, 4, '#e8b294');           // 입 쪽 손가락 끝
    P(oc + 1, 13, 2, 1, '#dca088'); P(oc + 1, 15, 2, 1, '#dca088');   // 손가락 선
    P(oc + 1, 17, 2, 3, '#25304c');                         // 소매
  });
  // 외침 효과선
  const cx = ox + w / 2, cy = oy + 28, f = Math.floor(t * 8) % 2;
  [[-1, -1], [-1, 0], [-1, 1], [1, -1], [1, 0], [1, 1]].forEach(([dx, dy]) => {
    const x = Math.round(cx + dx * (30 + f * 3)), y = Math.round(cy + dy * 10);
    rect(x, y, dx * 5, 1, '#fff6d6');
  });
}

function drawBoy() {
  const sway = Math.sin(t * (phase === 'party' ? 2.4 : 1.5));   // 아주 살짝만 흔들림
  const w = Math.round(boyCv.width * BOY_SCALE), h = Math.round(boyCv.height * BOY_SCALE);
  const ox = CX - Math.round(w / 2) + Math.round(sway * 1.2);
  const oy = tableY - h + 2;
  ctx.imageSmoothingEnabled = false;
  const blinking = (t % 3.6) < 0.13;
  if (shoutT >= 0 && shoutT < 3.9) { drawBoyShout(ox, oy, w, h); return; }
  ctx.drawImage(blinking ? boyBlink : boyCv, ox, oy, w, h);
  if (cheering()) {                              // 짝짝짝 박수
    const together = Math.floor(t / 0.16) % 2 === 0;
    const cx = ox + Math.round(w / 2), hy = tableY - 14, gap = together ? 2 : 9;
    [[-1], [1]].forEach(([d]) => {
      const hx = cx + d * gap - (d < 0 ? 5 : 0);
      rect(hx - 1, hy - 1, 7, 8, '#1e1624'); rect(hx, hy, 5, 6, '#f3cfb3'); rect(hx + (d < 0 ? 4 : 0), hy + 1, 1, 4, '#e2b596');
      rect(hx + (d < 0 ? 0 : 1), hy + 6, 4, 3, '#2e3a5c');           // 소매
    });
    if (together) { rect(cx - 8, hy - 5, 2, 1, '#fff6d6'); rect(cx + 7, hy - 5, 2, 1, '#fff6d6'); rect(cx, hy - 7, 1, 2, '#fff6d6'); }
  }
}

// 방 조명: 전체를 어둡게 덮고, 촛불 주변만 따뜻하게 살짝 밝힘
function drawLighting() {
  const c = candles[0], lx = c.x + 1, ly = c.y - 22;
  const gr = ctx.createRadialGradient(lx, ly, 2, lx, ly, 150);
  const a0 = clamp(dark - light * 0.5, 0, 1), a1 = clamp(dark - light * 0.2, 0, 1);
  gr.addColorStop(0, `rgba(8,5,16,${a0})`);
  gr.addColorStop(0.35, `rgba(8,5,16,${a1})`);
  gr.addColorStop(1, `rgba(8,5,16,${dark})`);
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  if (light > 0.01) {                                  // 따뜻한 촛불 색
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = light * 0.5; circle(lx, ly + 10, 40, '#1e1004');
    ctx.globalAlpha = light * 0.5; circle(lx, ly + 6, 22, '#24140a');
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }
  // 창밖 달빛은 늘 은은하게
  const mx = CX + 11, my = 36;
  ctx.globalAlpha = 0.9; circle(mx, my, 5, '#e8eeff'); rect(mx - 2, my - 2, 2, 2, '#c9d3f5'); rect(mx + 1, my + 2, 1, 1, '#c9d3f5');
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.25; circle(mx, my, 11, '#1a2240');
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

const roomBg = document.createElement('canvas'), roomFg = document.createElement('canvas');
let roomDirty = true;
function buildRoomCache() {
  const main = ctx;
  [roomBg, roomFg].forEach(c => { c.width = W; c.height = H; });
  ctx = roomBg.getContext('2d'); ctx.imageSmoothingEnabled = false; drawRoom();
  ctx = roomFg.getContext('2d'); ctx.imageSmoothingEnabled = false; drawTable(0); drawPlate(0); drawCheesecake(0);
  ctx = main;
  roomDirty = false;
}

function render() {
  if (phase === 'corridor') {
    drawCorridor();
  } else {
    // 성능: 변하지 않는 배경/테이블은 한 번만 그려두고 재사용
    if (roomDirty) buildRoomCache();
    ctx.drawImage(roomBg, 0, 0);
    drawCrowd();
    drawBoy();
    ctx.drawImage(roomFg, 0, 0);
    drawCdPlayer(121, tableY + 18);
    drawCandle(0);
    drawHands(0);
    drawLighting();
    drawFlames(0);
    drawDove();
  }
  smoke.forEach(s => { ctx.globalAlpha = clamp(s.life / 1.5, 0, 1) * 0.6; rect(Math.round(s.x), Math.round(s.y), 2, 2, '#9c94a8'); });
  ctx.globalAlpha = 1;
  sparks.forEach(s => { ctx.globalAlpha = clamp(s.life, 0, 1); rect(Math.round(s.x), Math.round(s.y), 1, 1, s.c); });
  fireworks.forEach(f => { ctx.globalAlpha = f.rocket ? 1 : clamp(f.life, 0, 1); rect(Math.round(f.x), Math.round(f.y), 1, f.rocket ? 3 : 1, f.c); });
  confetti.forEach(c => { ctx.globalAlpha = 1; rect(Math.round(c.x), Math.round(c.y), Math.sin(t * 6 + c.ph) > 0 ? 2 : 1, 1, c.c); });
  ctx.globalAlpha = 1;
  if (flash > 0) { ctx.globalAlpha = flash * 0.5; rect(0, 0, W, H, '#fff3d6'); ctx.globalAlpha = 1; }
  if (blackout > 0) { ctx.globalAlpha = blackout; rect(0, 0, W, H, '#0d0a14'); ctx.globalAlpha = 1; }
}

/* ================== 시작 ================== */
new ResizeObserver(layout).observe(screenEl);
layout();
setText('', '');
$('fade').style.opacity = 0;   // 캔버스가 직접 암전 처리

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
